[build]
  publish = "."
  functions = "netlify/functions"

[functions."daily-briefing"]
  schedule = "0 5 * * *"

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/jarvis"
  to = "/.netlify/functions/jarvis-background"
  status = 200

[[redirects]]
  from = "/api/device"
  to = "/.netlify/functions/device"
  status = 200

[[redirects]]
  from = "/hud"
  to = "/hud.html"
  status = 200

[[redirects]]
  from = "/jarvis"
  to = "/hud.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
