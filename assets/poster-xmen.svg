      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="35%" stop-color="#b45309" stop-opacity="0.25"/>
      <stop offset="75%" stop-color="#78350f" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="1"/>
