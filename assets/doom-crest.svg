<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="armorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Mask Contour -->
  <path d="M 50 40 Q 100 20 150 40 L 165 95 Q 160 150 100 185 Q 40 150 35 95 Z" 
        fill="url(#armorGrad)" stroke="#10b981" stroke-width="2.5" />

  <!-- Brow Plate -->
  <path d="M 55 50 L 100 68 L 145 50 L 138 75 L 100 88 L 62 75 Z" 
        fill="#334155" stroke="#64748b" stroke-width="1.5" />

  <!-- Glowing Emerald Eyes -->
  <polygon points="68,82 92,86 84,98 65,92" fill="url(#emeraldGlow)" filter="url(#glowFilter)" />
  <polygon points="132,82 108,86 116,98 135,92" fill="url(#emeraldGlow)" filter="url(#glowFilter)" />

  <!-- Iron Nose Bridge & Face Rivets -->
  <polygon points="97,72 103,72 105,125 95,125" fill="#1e293b" stroke="#059669" stroke-width="1" />

  <!-- Mouth Grille / Latverian Steel Slits -->
  <g stroke="#10b981" stroke-width="2" opacity="0.85">
    <line x1="82" y1="135" x2="82" y2="155" />
    <line x1="91" y1="132" x2="91" y2="160" />
    <line x1="100" y1="130" x2="100" y2="163" />
    <line x1="109" y1="132" x2="109" y2="160" />
    <line x1="118" y1="135" x2="118" y2="155" />
    <!-- Horizontal Crossbars -->
    <line x1="78" y1="140" x2="122" y2="140" stroke="#475569" stroke-width="1.5" />
    <line x1="80" y1="150" x2="120" y2="150" stroke="#475569" stroke-width="1.5" />
  </g>

  <!-- Cheek Armor Facets -->
  <path d="M 40 98 L 65 94 L 75 130 L 48 140 Z" fill="#1e293b" opacity="0.6" />
  <path d="M 160 98 L 135 94 L 125 130 L 152 140 Z" fill="#1e293b" opacity="0.6" />
</svg>
