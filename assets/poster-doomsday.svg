<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="100%" height="100%">
  <defs>
    <radialGradient id="nebulaGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#064e3b" stop-opacity="0.2"/>
      <stop offset="80%" stop-color="#022c22" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="metalPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="35%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="hoodGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="45%" stop-color="#047857"/>
      <stop offset="75%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <filter id="lensGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="1600" fill="#050507"/>
  <rect width="1200" height="1600" fill="url(#nebulaGlow)"/>

  <!-- Incursion Cosmic Rift Lines -->
  <g stroke="#10b981" stroke-width="1" opacity="0.25">
    <line x1="0" y1="200" x2="1200" y2="1400"/>
    <line x1="1200" y1="300" x2="0" y2="1500"/>
    <circle cx="600" cy="550" r="450" fill="none" stroke="#34d399" stroke-dasharray="4,8" opacity="0.3"/>
    <circle cx="600" cy="550" r="320" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Doctor Doom Hood Silhouette -->
  <path d="M 600 180 C 420 180 320 320 280 520 C 250 670 240 850 200 1100 C 350 1150 480 1160 600 1160 C 720 1160 850 1150 1000 1100 C 960 850 950 670 920 520 C 880 320 780 180 600 180 Z" 
        fill="url(#hoodGrad)"/>

  <!-- Inner Hood Shadow Void -->
  <path d="M 600 240 C 460 240 380 350 350 500 C 330 600 320 740 300 900 C 420 950 510 960 600 960 C 690 960 780 950 900 900 C 880 740 870 600 850 500 C 820 350 740 240 600 240 Z" 
        fill="#040608"/>

  <!-- Titanium Mask Geometry -->
  <path d="M 600 420 L 460 520 L 480 760 L 600 920 L 720 760 L 740 520 Z" 
        fill="url(#metalPlate)" stroke="#10b981" stroke-width="2"/>

  <!-- Brow Plate & Temple Screws -->
  <path d="M 470 530 L 600 580 L 730 530 L 710 600 L 600 640 L 490 600 Z" 
        fill="#334155" stroke="#475569" stroke-width="1.5"/>

  <!-- Glowing Emerald Eyes of Victor von Doom -->
  <polygon points="500,640 570,660 560,685 490,665" fill="#34d399" filter="url(#lensGlow)"/>
  <polygon points="700,640 630,660 640,685 710,665" fill="#34d399" filter="url(#lensGlow)"/>

  <!-- Riveted Nose Bridge -->
  <polygon points="593,590 607,590 610,750 590,750" fill="#1e293b" stroke="#047857" stroke-width="1"/>

  <!-- Latverian Mouth Grille -->
  <g stroke="#10b981" stroke-width="3" opacity="0.9">
    <line x1="560" y1="790" x2="560" y2="850"/>
    <line x1="580" y1="785" x2="580" y2="860"/>
    <line x1="600" y1="780" x2="600" y2="865"/>
    <line x1="620" y1="785" x2="620" y2="860"/>
    <line x1="640" y1="790" x2="640" y2="850"/>
    <line x1="540" y1="810" x2="660" y2="810" stroke="#64748b" stroke-width="2"/>
    <line x1="545" y1="835" x2="655" y2="835" stroke="#64748b" stroke-width="2"/>
  </g>

  <!-- Anamorphic Lens Flare Line -->
  <line x1="100" y1="660" x2="1100" y2="660" stroke="#34d399" stroke-width="1" opacity="0.35"/>
  <circle cx="600" cy="660" r="12" fill="#34d399" opacity="0.4" filter="url(#lensGlow)"/>

  <!-- Cinematic Grain Gradient Overlay -->
  <rect y="1000" width="1200" height="600" fill="url(#hoodGrad)" opacity="0.85"/>
  <rect y="1200" width="1200" height="400" fill="#050507"/>
</svg>
