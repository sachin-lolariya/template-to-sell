<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="100%" height="100%">
  <defs>
    <radialGradient id="incursionGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#dc2626" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#1e1b4b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="1"/>
    </radialGradient>
    <filter id="riftGlow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="1600" fill="#050507"/>
  <rect width="1200" height="1600" fill="url(#incursionGlow)"/>

  <!-- Incursion Colliding Planets / Realities -->
  <circle cx="450" cy="520" r="280" fill="#0f172a" stroke="#8b5cf6" stroke-width="2" opacity="0.8"/>
  <circle cx="750" cy="520" r="280" fill="#18181b" stroke="#ef4444" stroke-width="2" opacity="0.8"/>

  <!-- Incursion Collision Seam / Light Rift -->
  <path d="M 600 150 Q 580 400 600 520 Q 620 700 600 1000" fill="none" stroke="#fff" stroke-width="4" filter="url(#riftGlow)"/>
  <line x1="150" y1="520" x2="1050" y2="520" stroke="#f59e0b" stroke-width="1.5" opacity="0.5"/>

  <!-- Celestial Battleworld Floating Shards -->
  <polygon points="560,420 620,440 590,480" fill="#38bdf8" opacity="0.6"/>
  <polygon points="630,580 670,610 640,650" fill="#ef4444" opacity="0.6"/>
  <polygon points="530,620 570,640 540,690" fill="#a855f7" opacity="0.6"/>

  <!-- Void Bottom Fade -->
  <rect y="1100" width="1200" height="500" fill="#050507"/>
</svg>
